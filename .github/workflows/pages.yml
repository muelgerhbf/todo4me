name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'docs/screenshots/**'
      - 'docs/brand/**'
      - 'assets/icons/**'
      - 'build/icons/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

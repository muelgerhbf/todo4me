name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Build jobs run third-party code (npm ci), so they only get read access;
# only the release job may create the draft release.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable (no publish)
        run: node scripts/build.js nsis portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  build-linux:
    # Pinned: rpm 6 (newer Ubuntu) writes the v6 package format by default, which older
    # rpm-based distributions cannot install. Ubuntu 24.04 ships rpm 4.x → v4 packages.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install packaging tools (rpm, ar)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils
      - run: npm ci
      - name: Smoke check (ICS unit tests)
        run: node tests/test-ics.mjs
      - name: Build Linux packages (no publish)
        run: node scripts/build.js linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/latest-linux.yml
            dist/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION" >&2
            exit 1
          fi
      - name: Check files
        run: |
          ls -l artifacts
          test -f artifacts/latest.yml
          test -f artifacts/latest-linux.yml
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Todo4Me $VERSION" \
            --notes-file release-notes.md \
            artifacts/*

  <meta name="description" content="Todo4Me — a personal productivity dashboard for tasks, weekly planning and notes.">
  <meta name="color-scheme" content="light dark">
  <!-- Content Security Policy: only local files; the inline theme script below is allowed by its hash
       (if you edit that script, update the hash). Inline style attributes are used for dynamic colors. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-RPQDyn7LvmKcb6p3OqD6gJWX3UcQVVzI9RNbB+cFK/U='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Todo4Me</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var raw = localStorage.getItem('todo4me.data.v1');
        var s = raw ? (JSON.parse(raw).settings || {}) : {};
        var theme = s.theme === 'dark' || s.theme === 'light' ? s.theme
          : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (s.accent && /^#[0-9a-f]{6}$/i.test(s.accent)) document.documentElement.style.setProperty('--accent', s.accent);
      } catch (e) { /* storage unavailable: defaults apply */ }
    })();
  </script>
</head>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar__brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
        <span class="brand-name">Todo4Me</span>
        <button class="icon-btn sidebar__close" data-action="close-sidebar" aria-label="Close menu"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <button class="btn btn--primary btn--block sidebar__capture" data-action="quick-capture">
        <svg class="icon"><use href="#i-plus"/></svg><span>Quick capture</span><kbd>Q</kbd>
      </button>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar__footer">
        <button class="icon-btn" data-action="toggle-theme" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
          <svg class="icon"><use href="#i-moon"/></svg>
        </button>
        <span class="save-indicator" id="save-indicator" aria-live="polite"></span>
      </div>
    </aside>
    <div class="scrim" data-action="close-sidebar" aria-hidden="true"></div>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn" data-action="open-sidebar" aria-label="Open menu"><svg class="icon"><use href="#i-menu"/></svg></button>
        <span class="topbar__title" id="topbar-title">Todo4Me</span>
        <button class="icon-btn" data-action="new-task" aria-label="New task"><svg class="icon"><use href="#i-plus"/></svg></button>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <dialog id="confirm" class="modal modal--sm" aria-labelledby="confirm-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="js/storage.js"></script>
  <script src="js/store.js"></script>

  <script src="js/dashboard.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/desktop.js"></script>
</body>
</html>
